<script type="module">
  // pandoc wraps a mermaid fence in a pre.mermaid holding a code child, but
  // mermaid wants the source as the element's own text -- so swap in a plain div.
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
  window.addEventListener('DOMContentLoaded', async () => {
    document.querySelectorAll('pre.mermaid').forEach((pre) => {
      const d = document.createElement('div');
      d.className = 'mermaid';
      d.textContent = pre.textContent;
      pre.replaceWith(d);
    });
    mermaid.initialize({ startOnLoad: false, maxTextSize: 500000 });
    await mermaid.run();
  });
</script>
<style>
  body { max-width: 62rem; margin: 2rem auto; padding: 0 1.5rem;
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h2 { border-bottom: 1px solid #d8dee4; padding-bottom: .3em; margin-top: 2em; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid #d8dee4; padding: .45em .7em; text-align: left; vertical-align: top; }
  th { background: #f6f8fa; }
  .mermaid { margin: 1.5em 0; text-align: center; overflow-x: auto; }
</style>
